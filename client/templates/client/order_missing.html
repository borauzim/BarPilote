{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Commande introuvable - BarPilote</title>
    <meta name="theme-color" content="#102b21"/>
    <meta name="mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
    <meta name="apple-mobile-web-app-title" content="BarPilote"/>
    <link rel="manifest" href="{% static 'manifest.webmanifest' %}"/>
    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'barpilote_icon_transparent_512.png' %}"/>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <style>

        body { font-family: 'Public Sans', sans-serif; background: #f7f7f8; }
        .executive-shadow { box-shadow: 0 16px 50px rgba(26, 28, 29, 0.08); }
    </style>
    <link rel="stylesheet" href="{% static 'css/barpilote-theme.css' %}?v=nav-4">
    <link rel="stylesheet" href="{% static 'css/barpilote-client.css' %}?v=client-premium-1">
</head>
<body class="bp-client-app min-h-screen flex items-center justify-center px-4">
<!--
THESIS: BarPilote transforme les commandes, tables et alertes en missions visibles; il refuse le tableau de bord SaaS générique en cartes uniformes.
OWN-WORLD: Vert forêt mat, ivoire opérationnel, orange signal et vert de confirmation; rails sombres, panneaux précis, lignes fines et coins mesurés.
STORY: Le propriétaire supervise, le serveur exécute et le client commande dans une chaîne continue, lisible et traçable.
FIRST VIEWPORT: Un rail de commande cadre une surface d activité hiérarchisée; sur mobile, la mission ou l action principale occupe immédiatement le centre.
FORM: Centre de contrôle, option A approuvée par délégation; seed 92babb8e.
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
-->
    <main class="w-full max-w-lg rounded-3xl bg-white border border-gray-200 executive-shadow p-8 text-center">
        <div class="mx-auto mb-6 flex h-16 w-16 items-center justify-center rounded-2xl bg-orange-50 text-orange-600">
            <span class="material-symbols-outlined text-3xl">receipt_long</span>
        </div>
        <h1 class="text-2xl font-black text-slate-900">Commande introuvable</h1>
        <p class="mt-3 text-sm font-medium text-slate-600">{{ message|default:"Cette commande n'existe plus ou n'est plus accessible." }}</p>
        {% if order_id %}
        <p class="mt-2 text-xs font-bold uppercase tracking-widest text-slate-400">Référence: {{ order_id }}</p>
        {% endif %}
        <div class="mt-8 flex flex-col gap-3 sm:flex-row sm:justify-center">
            <a href="/" class="inline-flex items-center justify-center gap-2 rounded-2xl bg-slate-900 px-5 py-3 text-sm font-black text-white transition hover:bg-orange-600">
                <span class="material-symbols-outlined text-base">home</span>
                Retour à l'accueil
            </a>
            <button type="button" onclick="history.back()" class="inline-flex items-center justify-center gap-2 rounded-2xl border border-gray-200 bg-white px-5 py-3 text-sm font-black text-slate-700 transition hover:bg-gray-50">
                <span class="material-symbols-outlined text-base">arrow_back</span>
                Revenir en arrière
            </button>
        </div>
    </main>
    <script src="{% static 'js/barpilote-pwa.js' %}?v=4"></script>
</body>
</html>
