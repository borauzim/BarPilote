<div class="relative" id="notificationCenter" data-api-url="{% if is_server_interface %}{% url 'serveur_notifications_api' %}{% else %}{% url 'notifications_api' %}{% endif %}">
    <button type="button" id="notif-btn" onclick="toggleNotifMenu()" class="relative flex h-11 w-11 items-center justify-center rounded-xl border border-emerald-900/60 bg-[#06382B] p-2.5 text-emerald-200 shadow-sm transition duration-200 hover:bg-[#0F382C] hover:text-white active:scale-[0.96]" aria-label="Ouvrir les notifications" aria-haspopup="dialog" aria-controls="notif-menu" aria-expanded="false">
        <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v1.341C7.67 7.165 7 8.388 7 11v3.159c0 .538-.214 1.055-.595 1.436L5 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
        <span id="notificationBadge" class="hidden absolute -right-1.5 -top-1.5 min-w-5 h-5 items-center justify-center rounded-full bg-red-500 px-1.5 text-[10px] font-bold text-white shadow-md ring-2 ring-[#022C22]">0</span>
    </button>

    <div id="notif-menu" class="hidden absolute left-full bottom-0 ml-3 z-[9999] w-80 overflow-hidden rounded-2xl border border-gray-100 bg-white text-gray-800 shadow-2xl" role="dialog" aria-label="Notifications">
        <div class="flex items-center justify-between gap-3 border-b border-gray-100 bg-gray-50/50 p-4">
            <div class="flex min-w-0 items-center gap-2">
                <h3 class="text-sm font-bold text-gray-900">Notifications</h3>
                <span id="notificationSummary" class="whitespace-nowrap rounded-full bg-orange-100 px-2 py-0.5 text-[10px] font-semibold text-[#F97316]">Chargement</span>
            </div>
            <div class="flex shrink-0 items-center gap-2">
                <button type="button" onclick="markAllNotificationsRead()" class="text-xs font-semibold text-[#F97316] transition hover:text-[#EA580C] hover:underline">Tout lire</button>
                <a href="{% url 'notifications_html' %}" title="Ouvrir les notifications en plein écran" aria-label="Ouvrir les notifications en plein écran" class="inline-flex h-8 w-8 items-center justify-center rounded-lg text-gray-400 transition hover:bg-gray-200/70 hover:text-gray-700">
                    <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-2V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path></svg>
                </a>
            </div>
        </div>
        <div id="notificationList" class="max-h-80 overflow-y-auto divide-y divide-gray-100 overscroll-contain">
            <div class="p-8 text-center text-xs font-medium text-gray-400">Chargement des notifications...</div>
        </div>
        <div class="border-t border-gray-100 bg-gray-50 p-2.5 text-center">
            <button type="button" onclick="toggleNotifMenu()" class="text-xs font-semibold text-gray-600 transition hover:text-[#F97316]">Fermer les notifications</button>
        </div>
    </div>
</div>
<div id="notificationToast" role="alert" aria-live="assertive" class="fixed right-4 top-20 z-[120] hidden w-[min(92vw,360px)] translate-y-2 rounded-2xl border border-orange-100 bg-white p-4 opacity-0 shadow-[0_16px_40px_rgba(19,37,29,.16)] transition-all duration-200">
    <div class="flex items-start gap-3">
        <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-2xl bg-orange-50 text-orange-600">
            <span class="material-symbols-outlined text-lg">notifications_active</span>
        </div>
        <div class="min-w-0 flex-1">
            <p id="notificationToastTitle" class="text-sm font-black leading-tight text-on-surface">Nouvelle notification</p>
            <p id="notificationToastMessage" class="mt-1 text-xs font-bold leading-snug text-on-surface-variant/70"></p>
            <div id="notificationToastActions" class="mt-3 hidden grid grid-cols-2 gap-2">
                <button type="button" id="notificationToastAcceptBtn" class="rounded-xl bg-emerald-600 px-3 py-2 text-[10px] font-black uppercase tracking-widest text-white">Accepter</button>
                <button type="button" id="notificationToastRefuseBtn" class="rounded-xl bg-red-600 px-3 py-2 text-[10px] font-black uppercase tracking-widest text-white">Refuser</button>
            </div>
        </div>
    </div>
</div>

<script>
(function () {
    if (window.__barPiloteNotificationsReady) return;
    window.__barPiloteNotificationsReady = true;

    let knownNotificationIds = new Set();
    let firstNotificationLoad = true;
    let notificationRequestInFlight = false;
    let activeNotificationFilter = 'all';
    let currentToastActionUrls = {accept: '', refuse: ''};
    let currentToastNotificationId = '';

    const categoryIcons = {
        ORDER: 'room_service',
        DEBT: 'receipt_long',
        TABLE: 'table_bar',
        TEAM: 'badge',
        SYSTEM: 'info'
    };

    function getNotificationRoot() {
        return document.getElementById('notificationCenter');
    }

    function getCookie(name) {
        const value = `; ${document.cookie}`;
        const parts = value.split(`; ${name}=`);
        if (parts.length === 2) return parts.pop().split(';').shift();
        return '';
    }

    function escapeHtml(value) {
        return String(value || '').replace(/[&<>"]/g, function (char) {
            return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[char];
        });
    }

    function notificationFilterLabel(value) {
        if (value === 'unread') return 'Non vues';
        if (value === 'read') return 'Vues';
        return 'Toutes';
    }

    function paintNotificationFilters() {
        document.querySelectorAll('[data-notification-filter]').forEach(function (button) {
            const active = button.dataset.notificationFilter === activeNotificationFilter;
            button.classList.toggle('bg-orange-600', active);
            button.classList.toggle('text-white', active);
            button.classList.toggle('text-on-surface-variant', !active);
            button.classList.toggle('hover:bg-orange-50', !active);
            button.classList.toggle('hover:text-orange-600', !active);
        });
    }

    function notificationTargetUrl(item) {
        return (item && item.url) ? item.url : '#';
    }

    function handleNotificationAction(url, label) {
        if (!url) return;
        fetch(url, {
            method: 'POST',
            credentials: 'include',
            headers: {'X-CSRFToken': getCookie('csrftoken')}
        })
            .then(res => res.ok ? res.json() : Promise.reject(res))
            .then(data => {
                if (window.loadNotifications) window.loadNotifications();
                showNotificationToast({title: label || 'Action envoyée', message: data.message || 'Réponse enregistrée.'});
            })
            .catch(error => showNotificationToast({title: 'Erreur', message: error.message || 'Impossible de traiter la notification.'}));
    }

    function showNotificationToast(item) {
        const toast = document.getElementById('notificationToast');
        const title = document.getElementById('notificationToastTitle');
        const message = document.getElementById('notificationToastMessage');
        const actions = document.getElementById('notificationToastActions');
        const acceptBtn = document.getElementById('notificationToastAcceptBtn');
        const refuseBtn = document.getElementById('notificationToastRefuseBtn');
        if (!toast || !title || !message || !item) return;
        currentToastNotificationId = item.id || '';
        title.textContent = item.title || 'Nouvelle notification';
        message.textContent = item.message || '';
        const data = item.data || {};
        const isClientCall = data.kind === 'CLIENT_CALL';
        toast.classList.toggle('border-red-300', isClientCall);
        toast.classList.toggle('ring-4', isClientCall);
        toast.classList.toggle('ring-red-100', isClientCall);
        if (isClientCall && navigator.vibrate) navigator.vibrate([300, 150, 300]);
        if (isClientCall && window.BarPiloteNotifications?.startClientCallRingtone) window.BarPiloteNotifications.startClientCallRingtone();
        if (isClientCall && document.getElementById('bpServerGlobalOrderAlertStack')) return;
        currentToastActionUrls = {
            accept: data.action_accept_url || '',
            refuse: data.action_refuse_url || '',
        };
        const acceptLabel = data.action_accept_label || 'Accepter';
        const refuseLabel = data.action_refuse_label || 'Refuser';
        const hasActions = Boolean(currentToastActionUrls.accept || currentToastActionUrls.refuse);
        if (actions && acceptBtn && refuseBtn && hasActions) {
            actions.classList.remove('hidden');
            acceptBtn.textContent = acceptLabel;
            refuseBtn.textContent = refuseLabel;
            acceptBtn.disabled = !currentToastActionUrls.accept;
            refuseBtn.disabled = !currentToastActionUrls.refuse;
            acceptBtn.onclick = () => { handleNotificationAction(currentToastActionUrls.accept, acceptLabel); if (currentToastNotificationId) window.markNotificationRead(currentToastNotificationId); };
            refuseBtn.onclick = () => { handleNotificationAction(currentToastActionUrls.refuse, refuseLabel); if (currentToastNotificationId) window.markNotificationRead(currentToastNotificationId); };
        } else if (actions) {
            actions.classList.add('hidden');
            if (acceptBtn) acceptBtn.onclick = null;
            if (refuseBtn) refuseBtn.onclick = null;
        }
        toast.classList.remove('hidden');
        requestAnimationFrame(() => {
            toast.classList.remove('translate-y-2', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');
        });
        clearTimeout(window.__barPiloteNotificationToastTimer);
        if (hasActions) return;
        const toastDuration = isClientCall ? 10000 : 3500;
        window.__barPiloteNotificationToastTimer = setTimeout(() => {
            toast.classList.add('translate-y-2', 'opacity-0');
            toast.classList.remove('translate-y-0', 'opacity-100');
            setTimeout(() => toast.classList.add('hidden'), 220);
        }, toastDuration);
    }


    function upsertNotificationFromSocket(item) {
        if (!item || !item.id) return;
        const badge = document.getElementById('notificationBadge');
        const summary = document.getElementById('notificationSummary');
        const list = document.getElementById('notificationList');
        if (!badge || !summary || !list) return;

        const unreadCount = Number(badge.textContent === '99+' ? 100 : badge.textContent || 0) + 1;
        badge.textContent = unreadCount > 99 ? '99+' : unreadCount;
        badge.classList.remove('hidden');
        badge.classList.add('flex');
        summary.textContent = `${unreadCount} non lue(s)`;

        const icon = categoryIcons[item.category] || categoryIcons.SYSTEM;
        const html = `
                <a href="${escapeHtml(notificationTargetUrl(item))}" onclick="handleNotificationClick(event, '${item.id}')" class="flex gap-3 p-4 bg-orange-50/70 hover:bg-surface-container-lowest transition-colors">
                    <div class="w-10 h-10 rounded-2xl bg-white border border-surface-container flex items-center justify-center text-orange-600 shrink-0">
                        <span class="material-symbols-outlined text-lg">${icon}</span>
                    </div>
                    <div class="min-w-0 flex-1">
                        <div class="flex items-start justify-between gap-2">
                            <p class="text-sm font-black text-on-surface leading-tight">${escapeHtml(item.title || 'Nouvelle notification')}</p>
                            <span class="w-2 h-2 rounded-full bg-orange-600 shrink-0 mt-2"></span>
                        </div>
                        <p class="text-xs font-medium text-on-surface-variant/70 mt-1 leading-snug">${escapeHtml(item.message || '')}</p>
                        <p class="text-[10px] font-black uppercase tracking-widest text-on-surface-variant/40 mt-2">${escapeHtml(item.created_at || '')}</p>
                    </div>
                </a>`;
        if (!firstNotificationLoad && !knownNotificationIds.has(item.id)) {
            list.insertAdjacentHTML('afterbegin', html);
            knownNotificationIds.add(item.id);
            showNotificationToast(item);
        }
    }
    function renderNotifications(data) {
        const badge = document.getElementById('notificationBadge');
        const summary = document.getElementById('notificationSummary');
        const list = document.getElementById('notificationList');
        if (!badge || !summary || !list) return;

        const unread = Number(data.unread_count || 0);
        badge.textContent = unread > 99 ? '99+' : unread;
        badge.classList.toggle('hidden', unread === 0);
        badge.classList.toggle('flex', unread > 0);
        summary.textContent = unread ? unread + " nouvelle" + (unread > 1 ? "s" : "") : "Aucune nouvelle";
        paintNotificationFilters();

        const notifications = data.notifications || [];
        if (!firstNotificationLoad) {
            const fresh = notifications
                .filter(item => item && item.id && !knownNotificationIds.has(item.id) && !item.is_read)
                .reverse();
            fresh.forEach(showNotificationToast);
        } else {
            const pendingDebt = notifications.find(item => {
                const itemData = (item && item.data) || {};
                return item && !item.is_read && (itemData.action_accept_url || itemData.action_refuse_url);
            });
            if (pendingDebt) showNotificationToast(pendingDebt);
        }
        knownNotificationIds = new Set(notifications.filter(item => item && item.id).map(item => item.id));
        firstNotificationLoad = false;

        if (!notifications.length) {
            list.innerHTML = '<div class="p-8 text-center text-xs font-bold text-on-surface-variant/50">Aucune notification pour le moment.</div>';
            return;
        }

        list.innerHTML = notifications.map(function (item) {
            const icon = categoryIcons[item.category] || categoryIcons.SYSTEM;
            const unreadClass = item.is_read ? 'bg-white' : 'bg-orange-50/70';
            const dot = item.is_read ? '' : '<span class="w-2 h-2 rounded-full bg-orange-600 shrink-0 mt-2"></span>';
            const url = notificationTargetUrl(item);
            const itemData = item.data || {};
            const actionsHtml = (itemData.action_accept_url || itemData.action_refuse_url)
                ? '<div class="mt-3 grid grid-cols-2 gap-2">'
                    + (itemData.action_accept_url ? '<button type="button" data-notification-id="' + escapeHtml(item.id) + '" data-notification-action-url="' + escapeHtml(itemData.action_accept_url) + '" data-notification-action-label="' + escapeHtml(itemData.action_accept_label || 'Accepter') + '" class="rounded-xl bg-emerald-600 px-3 py-2 text-[10px] font-black uppercase tracking-widest text-white">' + escapeHtml(itemData.action_accept_label || 'Accepter') + '</button>' : '')
                    + (itemData.action_refuse_url ? '<button type="button" data-notification-id="' + escapeHtml(item.id) + '" data-notification-action-url="' + escapeHtml(itemData.action_refuse_url) + '" data-notification-action-label="' + escapeHtml(itemData.action_refuse_label || 'Refuser') + '" class="rounded-xl bg-red-600 px-3 py-2 text-[10px] font-black uppercase tracking-widest text-white">' + escapeHtml(itemData.action_refuse_label || 'Refuser') + '</button>' : '')
                    + '</div>'
                : '';
            return `
                <a href="${escapeHtml(url)}" onclick="handleNotificationClick(event, '${item.id}')" class="flex gap-3 p-4 ${unreadClass} hover:bg-surface-container-lowest transition-colors">
                    <div class="w-10 h-10 rounded-2xl bg-white border border-surface-container flex items-center justify-center text-orange-600 shrink-0">
                        <span class="material-symbols-outlined text-lg">${icon}</span>
                    </div>
                    <div class="min-w-0 flex-1">
                        <div class="flex items-start justify-between gap-2">
                            <p class="text-sm font-black text-on-surface leading-tight">${escapeHtml(item.title)}</p>
                            ${dot}
                        </div>
                        <p class="text-xs font-medium text-on-surface-variant/70 mt-1 leading-snug">${escapeHtml(item.message)}</p>
                        <p class="text-[10px] font-black uppercase tracking-widest text-on-surface-variant/40 mt-2">${escapeHtml(item.created_at)}</p>
                        ${actionsHtml}
                    </div>
                </a>`;
        }).join('');
    }

    window.loadNotifications = function () {
        const root = getNotificationRoot();
        if (!root || notificationRequestInFlight) return Promise.resolve();
        notificationRequestInFlight = true;
        const url = new URL(root.dataset.apiUrl, window.location.origin);
        url.searchParams.set('filter', activeNotificationFilter);
        return fetch(url.toString(), {
            headers: {'X-Requested-With': 'XMLHttpRequest'},
            cache: 'no-store'
        })
            .then(res => res.ok ? res.json() : Promise.reject(res))
            .then(renderNotifications)
            .catch(() => {})
            .finally(() => { notificationRequestInFlight = false; });
    };

    function handleRealtimeNotification(event) {
        if (event.detail) upsertNotificationFromSocket(event.detail);
    }

    function setNotificationMenuOpen(open) {
        const panel = document.getElementById('notif-menu');
        const button = document.getElementById('notif-btn');
        if (!panel || !button) return;
        panel.classList.toggle('hidden', !open);
        button.setAttribute('aria-expanded', open ? 'true' : 'false');
        if (open) window.loadNotifications();
    }

    window.toggleNotifMenu = function () {
        const panel = document.getElementById('notif-menu');
        if (!panel) return;
        if (panel.parentElement !== document.body) {
            document.body.appendChild(panel);
        }
        setNotificationMenuOpen(panel.classList.contains('hidden'));
    };
    window.toggleNotificationPanel = window.toggleNotifMenu;

    window.markNotificationRead = function (id) {
        const root = getNotificationRoot();
        if (!root || !id) return Promise.resolve();
        const body = new URLSearchParams();
        body.append('notification_id', id);
        return fetch(root.dataset.apiUrl, {
            method: 'POST',
            headers: {'X-CSRFToken': getCookie('csrftoken'), 'Content-Type': 'application/x-www-form-urlencoded'},
            body: body.toString()
        }).then(() => window.loadNotifications());
    };

    window.handleNotificationClick = function (event, id) {
        if (event) event.preventDefault();
        const link = event ? event.currentTarget : null;
        const target = link ? link.getAttribute('href') : '#';
        window.markNotificationRead(id).finally(function () {
            if (target && target !== '#') window.location.href = target;
        });
    };

    window.markAllNotificationsRead = function () {
        const root = getNotificationRoot();
        if (!root) return;
        const body = new URLSearchParams();
        body.append('action', 'mark_all_read');
        fetch(root.dataset.apiUrl, {
            method: 'POST',
            headers: {'X-CSRFToken': getCookie('csrftoken'), 'Content-Type': 'application/x-www-form-urlencoded'},
            body: body.toString()
        }).then(() => window.loadNotifications());
    };

    document.addEventListener('click', function (event) {
        const root = getNotificationRoot();
        const panel = document.getElementById('notif-menu');
        if (!root || !panel || panel.classList.contains('hidden')) return;
        if (!root.contains(event.target) && !panel.contains(event.target)) {
            setNotificationMenuOpen(false);
        }
    });

    document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape') setNotificationMenuOpen(false);
    });

    document.addEventListener('click', function (event) {
        const actionButton = event.target.closest('[data-notification-action-url]');
        if (actionButton) {
            event.preventDefault();
            event.stopPropagation();
            actionButton.disabled = true;
            handleNotificationAction(
                actionButton.dataset.notificationActionUrl,
                actionButton.dataset.notificationActionLabel
            );
            if (actionButton.dataset.notificationId) window.markNotificationRead(actionButton.dataset.notificationId);
            return;
        }
        const button = event.target.closest('[data-notification-filter]');
        if (!button) return;
        activeNotificationFilter = button.dataset.notificationFilter || 'all';
        paintNotificationFilters();
        window.loadNotifications();
    }, true);

    document.addEventListener('visibilitychange', function () {
        if (!document.hidden) window.loadNotifications();
    });

    window.addEventListener('focus', window.loadNotifications);

    document.addEventListener('DOMContentLoaded', function () {
        paintNotificationFilters();
        window.loadNotifications();
        window.removeEventListener('barpilote:notification', handleRealtimeNotification);
        window.addEventListener('barpilote:notification', handleRealtimeNotification);
    });
})();
</script>
